<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="nunatak">
  <title>nunatak</title>
  <!-- La silhouette EST le roofline : flanc gauche en diagonale (regime limite
       par la memoire), sommet plat (plafond de calcul), et le point de rupture
       entre les deux marque en accent chaud. Le massif emerge d'une nappe de
       glace, dont la partie immergee reste visible en filigrane. -->
  <defs>
    <clipPath id="nk-ice"><rect x="0" y="70" width="96" height="16"/></clipPath>
  </defs>
  <path d="M4 86 L36 14 H62 L70 44 L78 31 L92 86 Z" fill="#14324A"/>
  <rect x="0" y="70" width="96" height="16" fill="#BFE6F7"/>
  <path d="M4 86 L36 14 H62 L70 44 L78 31 L92 86 Z" fill="#14324A" opacity="0.18" clip-path="url(#nk-ice)"/>
  <circle cx="36" cy="14" r="5" fill="#E2701F"/>
</svg>
