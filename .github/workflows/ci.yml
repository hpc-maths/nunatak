# Tier 1 of the test strategy (spec ch. 13, ADR 0008): hosted runners,
# blocking. Everything here replays the recorded corpus or runs pure
# code - PMUs are generally not exposed in these virtual machines, so
# this tier verifies that commands launch, permissions are diagnosed
# and outputs parse, never that counters report true values. Tier 2
# (real PMUs, nightly, non-blocking) runs on a self-hosted machine and
# arrives separately.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The hermetic Python suite: corpus replay, analysis, attribution,
  # CLI - the entirety of what can lie to the user. The report app's
  # presence is stubbed by conftest, so Node is not needed here.
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    # The suite runs in well under a minute; the ceiling exists so that a
    # collector which never returns - measured on macOS, where xctrace
    # hangs and leaves DTServiceHub orphaned - fails a job instead of
    # holding a runner for an hour.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # x86_64, arm64 and Apple Silicon; the oldest and newest
        # CPython we support - upstream's support window, no house policy.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15]
        python: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev -e .
      - run: python -m pytest -q

  # The report mini-app: strict type check, bundle build, geometry
  # invariants and DOM snapshots against the frozen milestone payload.
  report-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: report-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: report-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # The example programs the tutorial profiles. They compile on every
  # tier-1 runner, which costs nothing and stops them rotting; that
  # nunatak's counters agree with gemm's analytic figure is a tier-2
  # question, needing a PMU this runner does not have.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -C examples
      - name: they run, and gemm states its own rate
        run: |
          ./examples/stencil 512 3
          ./examples/gemm 512 | grep -q "GFLOP/s analytic"

  # The explanation layer against the real pi, with the model stood in
  # for: the tests start a loopback endpoint that speaks the OpenAI
  # protocol, so this lane needs no API key, no network and no model.
  # What it checks is what a snapshot cannot - that pi still starts,
  # honours its hardening flags and answers in the event shape the
  # parser reads. The version is pinned because a blocking lane has to
  # be reproducible; the recorded corpus is pi 0.84.1, so this lane also
  # states that 0.84.3 is exercised.
  explanation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm install -g @earendil-works/pi-coding-agent@0.84.3
      - run: pi --version
      - run: python -m pip install --upgrade pip
      - run: pip install --group dev -e .
      - run: python -m pytest -q -m pi

  # The documentation builds warning-free on every pull request; the
  # docs workflow deploys it from main.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install --group docs -e .
      - run: sphinx-build -W --keep-going docs docs/_build/html

  # Packaging mechanics: the wheel builds, installs, and the CLI
  # answers. The build goes through the sdist, so it also proves the
  # sdist carries everything the report-asset hook needs. Node 24 via
  # setup-node: the runner's distro npm rejects our lockfile.
  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: report-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: python -m pip install dist/*.whl
      - run: nunatak --version
      - run: nunatak doctor --json
      # From outside the checkout, so the installed wheel answers, not
      # the source tree: released wheels must carry the report bundle.
      - run: >
          cd "$RUNNER_TEMP" && python -c
          "from nunatak.report.html import assets_available; assert assets_available()"
