# Tier 2 of the test strategy (spec ch. 13, ADR 0008): a self-hosted
# station with real PMUs, nightly, non-blocking. The only stage that
# verifies a counter actually reports a value - hosted virtual machines
# never can. It runs the hermetic suite first (a real Linux is also a
# tier-1 environment), then the hardware-marked tests that the rest of
# CI deliberately excludes.
#
# Never triggered by pull_request: a public repository's fork PRs must
# not reach a self-hosted machine.
name: ci-hardware

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-hardware
  cancel-in-progress: false

jobs:
  pmu:
    runs-on: [self-hosted, linux, x64, pmu]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # The station's distribution Node is too old for the app toolchain;
      # the same Node as tier 1, fetched into the runner's tool cache.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: python3 -m venv .venv && .venv/bin/pip install --quiet --upgrade pip
      - run: .venv/bin/pip install --quiet --group dev -e .
      - run: npm ci && npm run build
        working-directory: report-app
      # The artifacts the documentation publishes need a real PMU, so
      # this station is the only place they can be produced. The job
      # uploads them and a human commits them: nothing here pushes to
      # the repository. Regenerating one is a workflow_dispatch away.
      - name: the reports the documentation publishes
        run: |
          make -C examples
          ./examples/gemm 2>&1 | tee gemm-bare.log
          .venv/bin/nunatak run --name gemm -- ./examples/gemm 2>&1 | tee gemm-run.log
          # .nunatak is a dot-directory, and upload-artifact skips those
          # by default: the report is copied out rather than globbed.
          cp .nunatak/gemm-*/report.html gemm-report.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-reports
          path: |
            gemm-report.html
            gemm-bare.log
            gemm-run.log
          if-no-files-found: error

      - name: hermetic suite on real Linux
        run: .venv/bin/python -m pytest -q
      - name: what only hardware can verify
        run: .venv/bin/python -m pytest -q -m hardware
      # The station's LLVM keeps the frozen-binaries lane alive between
      # the version watch's twice-a-year runs.
      - name: real LLVM against the frozen-binaries corpus
        run: .venv/bin/python -m pytest -q -m llvm
